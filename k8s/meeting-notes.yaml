apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-notes
  labels:
    app: meeting-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meeting-notes
  template:
    metadata:
      labels:
        app: meeting-notes
    spec:
      volumes:
      - name: uploads-data
        persistentVolumeClaim:
          claimName: meeting-notes-uploads-pvc
      containers:
      - name: meeting-notes
        image: meeting-notes:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: uploads-data
          mountPath: /app/backend/uploads
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: BASE_PATH
          value: ""
        - name: EXTERNAL_URL
          value: "https://meeting.kaflix.com"
        - name: DB_HOST
          value: "postgres-pgvector"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: meeting-notes-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: meeting-notes-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: meeting-notes-secret
              key: DB_NAME
        - name: PGSSLMODE
          value: "disable"
        - name: CLAUDE_API_KEY
          valueFrom:
            secretKeyRef:
              name: meeting-notes-secret
              key: CLAUDE_API_KEY
        - name: SMTP_HOST
          value: "smtps.hiworks.com"
        - name: SMTP_PORT
          value: "465"
        - name: SMTP_USER
          value: "alpha@kaflix.com"
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: meeting-notes-secret
              key: SMTP_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: meeting-notes
spec:
  selector:
    app: meeting-notes
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meeting-notes-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - meeting.kaflix.com
    secretName: meeting-notes-tls
  rules:
  - host: meeting.kaflix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: meeting-notes
            port:
              number: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meeting-notes-uploads-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
